<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Pirates - Controle de Coleção</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="container">
        <div class="header-sistema">
            <h1>INK PIRATES</h1>
            <p class="subtitulo">Sistema de Controle de Coleção</p>
        </div>

        <section class="card-section">
            <h2>Adicionar Carta</h2>
            <form id="form-carta">
                <div class="input-group">
                    <label for="card-game">Card Game:</label>
                    <select id="card-game">
                        <option value="Digimon">Digimon</option>
                        <option value="Dragon Ball Fusion World">Dragon Ball Fusion World</option> 
                        <option value="Flesh and Blood">Flesh and Blood</option> 
                        <option value="Gundam">Gundam</option>                 
                        <option value="Lorcana">Lorcana</option>
                        <option value="Magic: The Gathering">Magic: The Gathering</option>
                        <option value="One Piece">One Piece</option>
                        <option value="Pokémon">Pokémon</option>
                        <option value="Riftbound">Riftbound</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="nome-carta">Nome:</label>
                    <input type="text" id="nome-carta" required placeholder="Ex: Mago Negro">
                </div>

                <div class="input-group">
                    <label for="numero-carta">Número:</label>
                    <input type="text" id="numero-carta" required placeholder="">
                </div>

                <div class="input-group">
                    <label for="colecao-carta">Coleção / Expansão:</label>
                    <select id="colecao-carta" required>
                    </select>
                </div>

                <div class="input-group">
                    <label for="qtd-carta">Quantidade:</label>
                    <input type="number" id="qtd-carta" min="1" value="1" required>
                </div>

                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <section class="card-section">
            <div class="flex-header">
                <h2>Minhas Cartas</h2>
                <button id="btn-exportar" onclick="gerarPDF()">Exportar PDF</button>
            </div>
            
            <div class="input-group">
                <label for="filtro-ordenacao">Ordenar por:</label>
                <select id="filtro-ordenacao" onchange="atualizarSistema()">
                    <option value="nome-asc">Nome (Crescente A-Z)</option>
                    <option value="nome-desc">Nome (Decrescente Z-A)</option>
                    <option value="colecao-asc">Edição / Coleção (Crescente A-Z)</option>
                    <option value="colecao-desc">Edição / Coleção (Decrescente Z-A)</option>
                    <option value="ano-asc">Ano da Coleção (Crescente - Mais antigo)</option>
                    <option value="ano-desc">Ano da Coleção (Decrescente - Mais recente)</option>
                    <option value="numero-asc">Número da Carta (Crescente)</option>
                    <option value="numero-desc">Número da Carta (Decrescente)</option>
                </select>
            </div>

            <div id="tabela-para-pdf">
            </div>
        </section>
    </div>

    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
