<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Pirates - Controle de Coleção</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="container">
        <div class="header-sistema">
            <h1>INK PIRATES</h1>
            <p class="subtitulo">Sistema de Controle de Coleção</p>
        </div>

        <section class="card-section">
            <h2>Adicionar Carta</h2>
            <form id="form-carta">
                <div class="input-group">
                    <label for="card-game">Card Game:</label>
                    <select id="card-game">
                        <option value="Digimon TCG">Digimon TCG</option>
                        <option value="Dragon Ball Fusion World">Dragon Ball Fusion World</option> 
                        <option value="Flesh and Blood">Flesh and Blood</option> 
                        <option value="Gundam TCG">Gundam TCG</option>                 
                        <option value="Lorcana TCG">Lorcana TCG</option>
                        <option value="Magic: The Gathering">Magic: The Gathering</option>
                        <option value="One Piece TCG">One Piece TCG</option>
                        <option value="Pokémon TCG">Pokémon TCG</option>
                        <option value="Riftbound TCG">Riftbound TCG</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="nome-carta">Nome da Carta:</label>
                    <input type="text" id="nome-carta" required placeholder="Ex: Roronoa Zoro">
                </div>

                <div class="input-group">
                    <label for="numero-carta">Número da Carta:</label>
                    <input type="text" id="numero-carta" required placeholder="Ex: OP01-001">
                </div>

                <div class="input-group">
                    <label for="colecao-carta">Coleção / Expansão:</label>
                    <select id="colecao-carta" required>
                    </select>
                </div>

                <div class="input-group">
                    <label for="qtd-carta">Quantidade Possuída:</label>
                    <input type="number" id="qtd-carta" min="1" value="1" required>
                </div>

                <button type="submit">Cadastrar na Coleção</button>
            </form>
        </section>

        <section class="card-section">
            <div class="flex-header">
                <h2>Minhas Cartas</h2>
                <button id="btn-exportar" onclick="gerarPDF()">Exportar PDF</button>
            </div>
            
            <table id="tabela-para-pdf">
                <thead>
                    <tr>
                        <th>Jogo</th>
                        <th>Nome</th>
                        <th>Número</th>
                        <th>Coleção</th>
                        <th>Qtd</th>
                    </tr>
                </thead>
                <tbody id="tabela-inventario">
                </tbody>
            </table>
        </section>
    </div>

    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
